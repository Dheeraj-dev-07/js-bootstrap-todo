<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <article>
        <section class="todo-page-section">
            <div class="container bg-light p-5 gy-4">
                <div class="row">

                    <div class="col-lg-12 text-center ">
                        <div class="heading-section bg-success text-light text-uppercase py-2">
                            <h1>TODO APP</h1>
                        </div>
                    </div>

                    <div class="col-lg-12 text-center">
                        <div class="search-form">

                            <form class="d-flex" role="search" id="search-task">

                                <div class="input-group">

                                    <input type="search" id="search-input" class="form-control" placeholder="Search..."
                                        aria-label="Search">

                                    <button class="btn btn-primary" type="submit">
                                        Search
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="tasks-heading text-start  text-uppercase fs-4 fw-bold ">
                            <p>Tasks</p>
                        </div>

                    </div>

                    <!-- <div class="col-lg-6 ">
                        <div class="add-task-button text-end">
                            <button type="button" class="btn btn-success" id="add-task-btn">add Task</button>
                        </div>
                    </div> -->

                    <div class="col-lg-12">

                        <div class="d-flex gap-2 mb-3">


                            <input type="text" id="task-input" class="form-control" placeholder="Enter your task...">

                            <button type="button" class="btn btn-success" id="add-task-btn">
                                Add Task
                            </button>

                        </div>

                    </div>

                    <div class="col-lg-12">
                        <div class="task-list-banner ">

                            <form action="#" id="table-all-data">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">Tasks </th>
                                            <th scope="col">Task Content</th>
                                            <th scope="col" class="text-center">Status</th>
                                            <th scope="col " class="text-center">Config</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-data">
                                        <tr>
                                            <th scope="row">~</th>
                                            <td><input class="form-control" type="text"
                                                    placeholder=" Enter Task here..."
                                                    aria-label="default input example">

                                            </td>
                                            <td>
                                                <div class="tasks-status text-center">

                                                    <span class="badge rounded-pill bg-warning ">pending</span>
                                                </div>

                                            </td>
                                            <td>
                                                <div class="task-list-buttons gx-4 d-flex justify-content-center gap-2">
                                                    <div id="delete-button">
                                                        <button type="button"
                                                            class="btn btn-danger btn-sm">Delete</button>
                                                    </div>
                                                    <div id="update-button">
                                                        <button type="button"
                                                            class="btn btn-secondary btn-sm">Update</button>
                                                    </div>
                                                    <div>
                                                        <button type="button" id="save-button"
                                                            class="btn btn-primary btn-sm">Save</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>

                                    </tbody>
                                </table>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </article>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="todo.js" defer></script>
</body>

</html>
